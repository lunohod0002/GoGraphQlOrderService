# redpanda.yaml
redpanda:
  data_directory: /var/lib/redpanda/data

  # Kafka API listeners
  kafka_api:
    - address: 0.0.0.0
      port: 29092          # внутренний (для других контейнеров)
    - address: 0.0.0.0
      port: 9093           # внешний (для хоста)
  advertised_kafka_api:
    - address: redpanda
      port: 29092
    - address: localhost
      port: 9093

  # Admin API (для rpk, Console, мониторинга)
  admin:
    - address: 0.0.0.0
      port: 9644

  # Pandaproxy (HTTP Kafka API)
  pandaproxy:
    - address: 0.0.0.0
      port: 8082
  advertised_pandaproxy_api:
    - address: localhost
      port: 8082

  # Schema Registry (опционально)
  schema_registry:
    - address: 0.0.0.0
      port: 8081

  # Обязательные параметры кластера
  node_id: 0
  seed_servers: []
  rpc_server:
    address: 0.0.0.0
    port: 33145

rpk:
  coredump_dir: /var/lib/redpanda/coredump